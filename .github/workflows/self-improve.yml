name: Harness Self Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "state/INCIDENT_LEDGER.md"
      - "state/WEIRD_LEDGER.md"
      - "state/CURRENT_PROJECT.json"
      - "state/RELEASE_RECEIPT.md"
      - "workers/self_improve.py"
      - ".github/workflows/self-improve.yml"

permissions:
  contents: write

concurrency:
  group: harness-self-improvement
  cancel-in-progress: true

jobs:
  learn-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outcome Counter + Why Worker + Rule Miner + Weird Salvage Indexer
        run: python workers/self_improve.py
      - name: Validate generated harness state
        run: |
          python -m json.tool state/HARNESS_SCORECARD.json >/dev/null
          grep -q "Auto-Generated Learned Rules" state/AUTOGENERATED_RULES.md
          grep -q "Win / Loss Analysis" state/WIN_LOSS_ANALYSIS.md
          grep -q "Weird Salvage Index" state/WEIRD_SALVAGE_INDEX.md
      - name: Commit self-rewrite outputs
        run: |
          FILES="state/HARNESS_SCORECARD.json state/WIN_LOSS_ANALYSIS.md state/AUTOGENERATED_RULES.md state/WEIRD_SALVAGE_INDEX.md"
          if git diff --quiet -- $FILES; then
            echo "No new harness learning."
            exit 0
          fi
          git config user.name "harness-learning-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Harness learns from latest wins losses and weird"
          git push
