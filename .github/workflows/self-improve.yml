name: Harness Self Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "state/INCIDENT_LEDGER.md"
      - "state/WEIRD_LEDGER.md"
      - "state/CURRENT_PROJECT.json"
      - "state/RELEASE_RECEIPT.md"
      - "workers/self_improve.py"
      - "tests/test_self_improve.py"
      - ".github/workflows/self-improve.yml"

permissions:
  contents: write

concurrency:
  group: harness-self-improvement
  cancel-in-progress: true

jobs:
  learn-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regression-test learning ingestion first
        id: regression
        continue-on-error: true
        run: python tests/test_self_improve.py

      - name: Outcome Counter + Why Worker + Rule Miner + Weird Salvage Indexer
        id: learn
        continue-on-error: true
        run: python workers/self_improve.py

      - name: Validate generated harness state semantically
        id: validate
        continue-on-error: true
        run: |
          python -m json.tool state/HARNESS_SCORECARD.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          score=json.loads(Path("state/HARNESS_SCORECARD.json").read_text())
          assert score["incident_count"] >= 1, score
          assert score["learned_rule_count"] >= 1, score
          assert "No learned rules yet." not in Path("state/AUTOGENERATED_RULES.md").read_text()
          print("semantic learning validation PASS")
          PY
          grep -q "Auto-Generated Learned Rules" state/AUTOGENERATED_RULES.md
          grep -q "Win / Loss Analysis" state/WIN_LOSS_ANALYSIS.md
          grep -q "Weird Salvage Index" state/WEIRD_SALVAGE_INDEX.md

      - name: Record harness's own run
        if: always()
        run: |
          RESULT="WIN"
          if [ "${{ steps.regression.outcome }}" != "success" ] || [ "${{ steps.learn.outcome }}" != "success" ] || [ "${{ steps.validate.outcome }}" != "success" ]; then RESULT="LOSS"; fi
          {
            echo ""
            echo "### SELF-RUN"
            echo "- **RESULT:** $RESULT"
            echo "- **SHA:** $GITHUB_SHA"
            echo "- **REGRESSION:** ${{ steps.regression.outcome }}"
            echo "- **LEARNER:** ${{ steps.learn.outcome }}"
            echo "- **VALIDATION:** ${{ steps.validate.outcome }}"
            echo "- **RUN:** $GITHUB_RUN_ID"
          } >> state/SELF_RUN_HISTORY.md

      - name: Commit self-rewrite outputs
        if: always()
        run: |
          git config user.name "harness-learning-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "No new harness learning."
            exit 0
          fi
          git commit -m "Harness learns from latest wins losses and weird"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Fail if the self-improvement run lost
        if: always()
        run: |
          if [ "${{ steps.regression.outcome }}" != "success" ] || [ "${{ steps.learn.outcome }}" != "success" ] || [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "Self-improvement run recorded as LOSS."
            exit 1
          fi
