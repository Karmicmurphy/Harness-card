name: Harness Learning Candidate Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "state/INCIDENT_LEDGER.md"
      - "state/WEIRD_LEDGER.md"
      - "state/CURRENT_PROJECT.json"
      - "state/RELEASE_RECEIPT.md"
      - "state/ECOSYSTEM_AUTHORITY_INDEX.json"
      - "state/ACTIVE_WORK_ORDER.md"
      - "projects/PROJECT_INDEX.md"
      - "workers/self_improve.py"
      - "workers/validate_authority_spine.py"
      - ".github/workflows/self-improve.yml"
  pull_request:
    paths:
      - "state/**"
      - "projects/PROJECT_INDEX.md"
      - "config/harness.json"
      - "workers/**"
      - "tests/**"
      - ".github/workflows/self-improve.yml"

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real learning regression
        run: python tests/test_self_improve.py
      - name: Validate authority spine
        run: python tests/test_authority_spine.py
      - name: Upload generated learning as candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: harness-learning-candidate-${{ github.run_id }}
          path: |
            state/HARNESS_SCORECARD.json
            state/WIN_LOSS_ANALYSIS.md
            state/AUTOGENERATED_RULES.md
            state/WEIRD_SALVAGE_INDEX.md
          if-no-files-found: error
