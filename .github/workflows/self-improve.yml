name: Harness Self Improvement

on:
  pull_request:
    paths:
      - ".github/workflows/self-improve.yml"
      - "tests/test_self_improve.py"
      - "tests/test_self_improve_writer.py"
      - "tests/test_friday_operator_learning.py"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "state/INCIDENT_LEDGER.md"
      - "state/WEIRD_LEDGER.md"
      - "state/LEARNING_CANDIDATES.json"
      - "state/FRIDAY_OPERATOR_REPAIR_HISTORY.json"
      - "state/CURRENT_PROJECT.json"
      - "state/RELEASE_RECEIPT.md"
      - "workers/self_improve.py"
      - "workers/learning_intake.py"
      - "tests/test_self_improve.py"
      - "tests/test_learning_intake.py"
      - ".github/workflows/self-improve.yml"

permissions:
  contents: write

concurrency:
  group: harness-state-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  learn-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regression-test learning ingestion first
        id: regression
        continue-on-error: true
        run: |
          python tests/test_self_improve.py
          python tests/test_friday_operator_learning.py
          python tests/test_self_improve_writer.py

      - name: Outcome Counter + Why Worker + Rule Miner + Weird Salvage Indexer
        id: learn
        continue-on-error: true
        run: python workers/self_improve.py

      - name: Sanitized generalized learning intake
        id: learning
        continue-on-error: true
        run: python workers/learning_intake.py

      - name: Validate generated harness state semantically
        id: validate
        continue-on-error: true
        run: |
          python -m json.tool state/HARNESS_SCORECARD.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          score=json.loads(Path("state/HARNESS_SCORECARD.json").read_text())
          assert score["incident_count"] >= 1, score
          assert score["learned_rule_count"] >= 1, score
          assert score["learning_candidate_count"] >= 0, score
          assert score["proven_learning_candidate_count"] >= 0, score
          assert "No learned rules yet." not in Path("state/AUTOGENERATED_RULES.md").read_text()
          print("semantic learning validation PASS")
          PY
          grep -q "Auto-Generated Learned Rules" state/AUTOGENERATED_RULES.md
          grep -q "Win / Loss Analysis" state/WIN_LOSS_ANALYSIS.md
          grep -q "Weird Salvage Index" state/WEIRD_SALVAGE_INDEX.md
          grep -q "Learning Candidate Index" state/LEARNING_CANDIDATE_INDEX.md

      # Learning and FRIDAY's owner view must be updated in the SAME writer
      # run. GitHub Actions does not recursively trigger workflows for pushes
      # created with the default GITHUB_TOKEN; relying on a second workflow
      # can leave machine status older than the learner that produced it.
      - name: Refresh FRIDAY machine status from this learning pass
        id: friday_status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: |
          python scripts/foundation_state.py observe > foundation-observation.json || true
          python scripts/friday_control_plane.py build --observation foundation-observation.json
          python - <<'PY'
          import json
          from pathlib import Path
          score=json.loads(Path("state/HARNESS_SCORECARD.json").read_text())
          status=json.loads(Path("state/FRIDAY_MACHINE_STATUS.json").read_text())
          for key in ("incident_count", "learned_rule_count", "closed_incident_rule_count", "unresolved_incident_prevention_count"):
              assert status["self_improvement"].get(key) == score.get(key), key
          assert "FRIDAY Machine Status" in Path("state/FRIDAY_MACHINE_STATUS.md").read_text()
          print("FRIDAY learning/status synchronization PASS")
          PY

      - name: Record harness's own run
        if: always()
        run: |
          RESULT="WIN"
          if [ "${{ steps.regression.outcome }}" != "success" ] || [ "${{ steps.learn.outcome }}" != "success" ] || [ "${{ steps.learning.outcome }}" != "success" ] || [ "${{ steps.validate.outcome }}" != "success" ] || [ "${{ steps.friday_status.outcome }}" != "success" ]; then RESULT="LOSS"; fi
          {
            echo ""
            echo "### SELF-RUN"
            echo "- **RESULT:** $RESULT"
            echo "- **SHA:** $GITHUB_SHA"
            echo "- **REGRESSION:** ${{ steps.regression.outcome }}"
            echo "- **LEARNER:** ${{ steps.learn.outcome }}"
            echo "- **GENERALIZED_LEARNING:** ${{ steps.learning.outcome }}"
            echo "- **VALIDATION:** ${{ steps.validate.outcome }}"
            echo "- **FRIDAY_STATUS_SYNC:** ${{ steps.friday_status.outcome }}"
            echo "- **RUN:** $GITHUB_RUN_ID"
          } >> state/SELF_RUN_HISTORY.md

      - name: Commit self-rewrite outputs
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: |
          git config user.name "harness-learning-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "No new harness learning."
            exit 0
          fi
          git commit -m "Harness learns from latest wins losses and weird"
          # A stale generated commit must not be replayed onto newer FRIDAY
          # state; build a NEW learning result on current verified main instead.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            unexpected=""
            while IFS= read -r changed; do
              case "$changed" in
                state/FRIDAY_MACHINE_STATUS.json|state/FRIDAY_MACHINE_STATUS.md|state/FRIDAY_OPERATOR_LAST_RUN.json|state/FRIDAY_OPERATOR_REPAIR_HISTORY.json|state/FRIDAY_MAINTENANCE_QUEUE.json|state/HARNESS_SCORECARD.json|state/AUTOGENERATED_RULES.md|state/WIN_LOSS_ANALYSIS.md|state/WEIRD_SALVAGE_INDEX.md|state/LEARNING_CANDIDATE_INDEX.md|state/SELF_RUN_HISTORY.md)
                  ;;
                *) unexpected="$unexpected $changed" ;;
              esac
            done < <(git diff --name-only "$GITHUB_SHA" origin/main)
            if [ -n "$unexpected" ]; then
              echo "Refusing to rebuild learning over unreviewed code or canonical authority changes:"
              echo "$unexpected"
              exit 1
            fi

            git reset --hard origin/main
            git clean -fd
            python scripts/check_authority_spine.py
            python scripts/foundation_state.py check
            python tests/test_self_improve.py
            python tests/test_friday_operator_learning.py
            python workers/self_improve.py
            python workers/learning_intake.py
            python -m json.tool state/HARNESS_SCORECARD.json >/dev/null
            python scripts/foundation_state.py observe > foundation-observation.json
            python scripts/friday_control_plane.py build --observation foundation-observation.json
            python - <<'PY'
          import json
          from pathlib import Path
          score = json.loads(Path("state/HARNESS_SCORECARD.json").read_text())
          status = json.loads(Path("state/FRIDAY_MACHINE_STATUS.json").read_text())
          for key in ("incident_count", "learned_rule_count", "closed_incident_rule_count", "unresolved_incident_prevention_count"):
              assert status["self_improvement"].get(key) == score.get(key), key
          assert status["self_improvement"].get("friday_operator_outcomes") == score.get("friday_operator_learning")
          print("FRIDAY post-collision learning/status independent reconciliation PASS")
          PY
            {
              echo ""
              echo "### SELF-RUN"
              echo "- **RESULT:** WIN"
              echo "- **SHA:** $(git rev-parse HEAD)"
              echo "- **REGRESSION:** success"
              echo "- **LEARNER:** success"
              echo "- **GENERALIZED_LEARNING:** success"
              echo "- **VALIDATION:** success"
              echo "- **FRIDAY_STATUS_SYNC:** success"
              echo "- **RUN:** $GITHUB_RUN_ID"
              echo "- **RECONCILED_AFTER_GENERATED_STATE_COLLISION:** YES"
            } >> state/SELF_RUN_HISTORY.md
            git add -A state
            if git diff --cached --quiet; then
              echo "Latest verified learning already present."
              exit 0
            fi
            git commit -m "Rebuild Harness learning against latest generated state"
            sleep 2
          done
          echo "Unable to publish refreshed Harness learning after three bounded attempts."
          exit 1

      - name: Fail if the self-improvement run lost
        if: always()
        run: |
          if [ "${{ steps.regression.outcome }}" != "success" ] || [ "${{ steps.learn.outcome }}" != "success" ] || [ "${{ steps.learning.outcome }}" != "success" ] || [ "${{ steps.validate.outcome }}" != "success" ] || [ "${{ steps.friday_status.outcome }}" != "success" ]; then
            echo "Self-improvement run recorded as LOSS."
            exit 1
          fi
