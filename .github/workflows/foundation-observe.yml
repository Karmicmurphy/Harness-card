name: Observe Foundation drift

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/foundation-observe.yml'
      - 'scripts/report_foundation_observations.py'
      - 'tests/test_report_foundation_observations.py'
      - 'scripts/foundation_state.py'
      - 'scripts/inspect_preview_sync.py'
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate canonical continuity
        run: python scripts/check_authority_spine.py
      - name: Test truthful read-only observation receipts
        run: python -m unittest discover -s tests -p 'test_report_foundation_observations.py' -v
      - name: Test read-only preview inspector
        if: always()
        run: python -m unittest discover -s tests -p 'test_inspect_preview_sync.py' -v
      - name: Observe refs without promotion
        if: always()
        # Valid UNKNOWN/drift exits 0 but remains visible in the JSON receipt.
        # A broken observer must fail its step; the validator also checks output.
        env:
          # Existing optional read-only cross-repo credential; otherwise private
          # components correctly remain UNKNOWN with the repo-scoped token.
          GH_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: python scripts/foundation_state.py observe > foundation-observation.json
      - name: Inspect approved Pages Preview without reading secret values
        if: always()
        # Valid UNKNOWN/CONFIG_BLOCKED exits 0 and remains in the receipt.
        # Truly malformed or failing execution still fails the workflow.
        env:
          # Optional narrowly scoped read-only Cloudflare credential and account ID.
          # Without these, the report is UNKNOWN, never falsely green.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: python scripts/inspect_preview_sync.py > preview-sync-observation.json
      - name: Validate and summarize actual observation state
        if: always()
        run: python scripts/report_foundation_observations.py foundation-observation.json preview-sync-observation.json
      - name: Preserve observations even on drift or unavailable access
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: foundation-sync-observations
          path: |
            foundation-observation.json
            preview-sync-observation.json
          if-no-files-found: warn
