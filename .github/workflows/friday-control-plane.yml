name: FRIDAY Automation Spine

on:
  workflow_dispatch:
  schedule:
    - cron: "37 12 * * *"
  pull_request:
    paths:
      - "scripts/night_shift_receipt.py"
      - "tests/test_night_shift_receipt.py"
      - "scripts/friday_operator.py"
      - "scripts/friday_diagnostics.py"
      - "scripts/friday_foundry_consumer.py"
      - "scripts/resolve_skill.py"
      - "tests/test_friday_foundry_consumer.py"
      - "tests/test_friday_diagnostics.py"
      - "tests/test_friday_operator.py"
      - "tests/test_friday_owner_vision_contract.py"
      - "docs/FRIDAY_OWNER_VISION_AND_LEARNING_LOOP_2026-10-23.md"
      - "skills/chat-software-harness/SKILL.md"
      - "skills/friday-provider-release/SKILL.md"
      - "AGENTS.md"
      - "tests/test_friday_operator_learning.py"
      - "workers/self_improve.py"
      - "config/friday_automation_policy.json"
      - "config/owner_access_profile.json"
      - "config/skill_registry.json"
      - "state/CURRENT_PROJECT.json"
      - "state/HARNESS_SCORECARD.json"
      - "state/LEARNING_CANDIDATES.json"
      - "scripts/foundation_state.py"
      - "scripts/friday_control_plane.py"
      - "workers/learning_intake.py"
      - "skills/constraint-breaker-lab/**"
      - "tests/test_friday_control_plane.py"
      - "tests/test_friday_status_writer.py"
      - "tests/test_learning_intake.py"
      - "config/skill_registry.json"
      - "skills/friday-provider-release/**"
      - "scripts/provider_release_gate.py"
      - "tests/test_provider_release_gate.py"
      - ".github/workflows/friday-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "scripts/night_shift_receipt.py"
      - "tests/test_night_shift_receipt.py"
      - "scripts/friday_operator.py"
      - "scripts/friday_diagnostics.py"
      - "scripts/friday_foundry_consumer.py"
      - "scripts/resolve_skill.py"
      - "tests/test_friday_foundry_consumer.py"
      - "tests/test_friday_diagnostics.py"
      - "tests/test_friday_operator.py"
      - "tests/test_friday_owner_vision_contract.py"
      - "docs/FRIDAY_OWNER_VISION_AND_LEARNING_LOOP_2026-10-23.md"
      - "skills/chat-software-harness/SKILL.md"
      - "skills/friday-provider-release/SKILL.md"
      - "AGENTS.md"
      - "tests/test_friday_operator_learning.py"
      - "workers/self_improve.py"
      - "config/friday_automation_policy.json"
      - "config/skill_registry.json"
      - "state/CURRENT_PROJECT.json"
      - "state/HARNESS_SCORECARD.json"
      - "state/LEARNING_CANDIDATES.json"
      - "scripts/foundation_state.py"
      - "scripts/friday_control_plane.py"
      - "workers/learning_intake.py"
      - "skills/constraint-breaker-lab/**"
      - "tests/test_friday_control_plane.py"
      - "tests/test_learning_intake.py"
      - ".github/workflows/friday-control-plane.yml"

permissions:
  contents: write

concurrency:
  group: harness-state-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical authority spine
        id: authority
        run: python scripts/check_authority_spine.py

      - name: Validate continuity projections
        id: continuity
        run: python scripts/foundation_state.py check

      - name: Observe approved refs without promotion
        id: observe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: python scripts/foundation_state.py observe > foundation-observation.json

      - name: Night Shift full Harness regression suite
        id: harness_tests
        run: |
          python -m unittest tests.test_authority_spine tests.test_foundation_state tests.test_skill_registry -v
          python tests/test_self_improve.py
          python tests/test_learning_intake.py
          python tests/test_night_shift_receipt.py
          python -m unittest discover -s tests -p 'test_provider_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_friday_operator.py' -v
          python tests/test_friday_operator_learning.py
          python tests/test_friday_owner_vision_contract.py
          python tests/test_friday_diagnostics.py
          python -m unittest discover -s tests -p test_friday_foundry_consumer.py -v
          python tests/test_friday_private_read_access.py
          python tests/test_friday_status_writer.py

      - name: Restore test-generated state before owner-status build
        run: |
          git restore state/HARNESS_SCORECARD.json state/AUTOGENERATED_RULES.md state/WIN_LOSS_ANALYSIS.md state/WEIRD_SALVAGE_INDEX.md
          rm -f state/LEARNING_CANDIDATE_INDEX.md

      - name: Test FRIDAY control plane
        id: control_plane_test
        run: python tests/test_friday_control_plane.py

      - name: Refresh owner-readable machine state
        id: render
        run: python scripts/friday_control_plane.py build --observation foundation-observation.json

      - name: Validate rendered state
        id: rendered_validation
        run: |
          python -m json.tool state/FRIDAY_MACHINE_STATUS.json >/dev/null
          grep -q "FRIDAY Machine Status" state/FRIDAY_MACHINE_STATUS.md
          grep -q "Next machine move" state/FRIDAY_MACHINE_STATUS.md

      - name: FRIDAY chooses and executes one allowed machine-maintenance action
        id: friday_operator
        env:
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: python scripts/friday_operator.py --observation foundation-observation.json --receipt friday-operator/receipt.json

      - name: Refresh owner status with bounded FRIDAY operator receipt
        id: operator_status
        if: always()
        run: python scripts/friday_control_plane.py build --observation foundation-observation.json

      # Night Shift can execute approved, local, reversible maintenance only; it never performs a deployment or a live job.
      # The receipt is kept even if an earlier test fails, so the next session can recover.
      - name: Preserve Night Shift check receipt
        if: always()
        env:
          OPERATOR_RESULT: ${{ steps.friday_operator.outcome }}
          OPERATOR_STATUS_RESULT: ${{ steps.operator_status.outcome }}
          AUTHORITY_RESULT: ${{ steps.authority.outcome }}
          CONTINUITY_RESULT: ${{ steps.continuity.outcome }}
          REGRESSION_RESULT: ${{ steps.harness_tests.outcome }}
          OBSERVATION_RESULT: ${{ steps.observe.outcome }}
          CONTROL_PLANE_RESULT: ${{ steps.control_plane_test.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          VALIDATION_RESULT: ${{ steps.rendered_validation.outcome }}
        run: python scripts/night_shift_receipt.py

      - name: Preserve status artifact for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-machine-status
          path: |
            state/FRIDAY_MACHINE_STATUS.json
            state/FRIDAY_MACHINE_STATUS.md
            foundation-observation.json
            friday-operator/receipt.json
            state/FRIDAY_OPERATOR_LAST_RUN.json
            state/FRIDAY_OPERATOR_REPAIR_HISTORY.json
            state/FRIDAY_MAINTENANCE_QUEUE.json
            night-shift/receipt.md
            

      - name: Commit refreshed owner view on main only
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN || github.token }}
        run: |
          git config user.name "friday-control-plane"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/FRIDAY_MACHINE_STATUS.json state/FRIDAY_MACHINE_STATUS.md
          if [ -f state/FRIDAY_OPERATOR_LAST_RUN.json ]; then git add state/FRIDAY_OPERATOR_LAST_RUN.json; fi
          if [ -f state/FRIDAY_OPERATOR_REPAIR_HISTORY.json ]; then git add state/FRIDAY_OPERATOR_REPAIR_HISTORY.json; fi
          if [ -f state/FRIDAY_MAINTENANCE_QUEUE.json ]; then git add state/FRIDAY_MAINTENANCE_QUEUE.json; fi
          if git diff --cached --quiet; then
            echo "FRIDAY status already current."
            exit 0
          fi
          git commit -m "Refresh FRIDAY machine status"
          # This is a disposable CI checkout. Remove all test/observation residue after
          # the status commit so rebasing can never be blocked by unrelated dirty files.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true

            # A rebase conflict cannot be repaired by retrying the SAME commit.
            # Only generated, non-authoritative Harness state may have changed
            # since this run started. Never auto-replay onto new code, pins,
            # work orders, secrets or unreviewed changes.
            unexpected=""
            while IFS= read -r changed; do
              case "$changed" in
                state/FRIDAY_MACHINE_STATUS.json|state/FRIDAY_MACHINE_STATUS.md|state/FRIDAY_OPERATOR_LAST_RUN.json|state/FRIDAY_OPERATOR_REPAIR_HISTORY.json|state/FRIDAY_MAINTENANCE_QUEUE.json|state/HARNESS_SCORECARD.json|state/AUTOGENERATED_RULES.md|state/WIN_LOSS_ANALYSIS.md|state/WEIRD_SALVAGE_INDEX.md|state/LEARNING_CANDIDATE_INDEX.md|state/SELF_RUN_HISTORY.md)
                  ;;
                *) unexpected="$unexpected $changed" ;;
              esac
            done < <(git diff --name-only "$GITHUB_SHA" origin/main)
            if [ -n "$unexpected" ]; then
              echo "Refusing to replay FRIDAY output onto unreviewed source/authority changes:"
              echo "$unexpected"
              exit 1
            fi

            # Regenerate against current main rather than attempting to
            # cherry-pick timestamped status into a newer generated file.
            git reset --hard origin/main
            git clean -fd
            python scripts/check_authority_spine.py
            python scripts/foundation_state.py check
            python scripts/foundation_state.py observe > foundation-observation.json
            python tests/test_friday_control_plane.py
            python tests/test_friday_status_writer.py
            python tests/test_friday_diagnostics.py
            python scripts/friday_control_plane.py build --observation foundation-observation.json
            python scripts/friday_operator.py --observation foundation-observation.json --receipt friday-operator/receipt.json
            python scripts/friday_control_plane.py build --observation foundation-observation.json
            git add state/FRIDAY_MACHINE_STATUS.json state/FRIDAY_MACHINE_STATUS.md state/FRIDAY_OPERATOR_LAST_RUN.json
            if [ -f state/FRIDAY_OPERATOR_REPAIR_HISTORY.json ]; then git add state/FRIDAY_OPERATOR_REPAIR_HISTORY.json; fi
            if [ -f state/FRIDAY_MAINTENANCE_QUEUE.json ]; then git add state/FRIDAY_MAINTENANCE_QUEUE.json; fi
            if git diff --cached --quiet; then
              echo "Remote main already has current validated status."
              exit 0
            fi
            git commit -m "Refresh FRIDAY machine status after generated-state collision"
            sleep 2
          done
          echo "Unable to publish FRIDAY status after three fresh validation attempts."
          exit 1
